[mypy]
python_version = 3.10
ignore_missing_imports = True
ignore_errors = False
strict = True
disallow_any_unimported = True
disallow_any_expr = True
disallow_any_decorated = True
disallow_any_explicit = True
disallow_any_generics = True
disallow_subclassing_any = True
disallow_untyped_calls = True
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_return_any = True
warn_unreachable = True
strict_equality = True
extra_checks = True
disable_error_code = misc,operator,union-attr,type-arg,arg-type,index,attr-defined,unreachable,call-arg,dict-item,assignment,list-item,return-value,no-any-return,func-returns-value,call-overload,comparison-overlap,override,var-annotated,str-bytes-safe,method-assign,untyped-decorator,unused-ignore,no-any-unimported,name-defined,type-var,valid-type,str-unpack,exit-return,abstract,no-redef,truthy-function,safe-super,return
namespace_packages = True
explicit_package_bases = True
mypy_path = packages/python/onnx9000-agent/src,packages/python/onnx9000-arena/src,packages/python/onnx9000-array/src,packages/python/onnx9000-backend-apple/src,packages/python/onnx9000-backend-cuda/src,packages/python/onnx9000-backend-native/src,packages/python/onnx9000-backend-rocm/src,packages/python/onnx9000-backend-webgpu/src,packages/python/onnx9000-c-compiler/src,packages/python/onnx9000-compile/src,packages/python/onnx9000-converters/src,packages/python/onnx9000-core/src,packages/python/onnx9000-custom-ops/src,packages/python/onnx9000-diffusers/src,packages/python/onnx9000-genai/src,packages/python/onnx9000-gguf/src,packages/python/onnx9000-graphsurgeon/src,packages/python/onnx9000-hummingbird/src,packages/python/onnx9000-jax/src,packages/python/onnx9000-json-extract/src,packages/python/onnx9000-keras2onnx/src,packages/python/onnx9000-llama-web/src,packages/python/onnx9000-mlir-lowering/src,packages/python/onnx9000-mlir/src,packages/python/onnx9000-mmdnn/src,packages/python/onnx9000-mobile-memory/src,packages/python/onnx9000-new-model-arch/src,packages/python/onnx9000-olive-optimizer/src,packages/python/onnx9000-onnx-checker/src,packages/python/onnx9000-onnx-script/src,packages/python/onnx9000-onnx-tool/src,packages/python/onnx9000-onnx2c/src,packages/python/onnx9000-onnx2gguf/src,packages/python/onnx9000-onnx2tf/src,packages/python/onnx9000-openvino/src,packages/python/onnx9000-optimizer/src,packages/python/onnx9000-optimum/src,packages/python/onnx9000-ort-training/src,packages/python/onnx9000-paddle2onnx/src,packages/python/onnx9000-profiler/src,packages/python/onnx9000-progressive-loading/src,packages/python/onnx9000-pytorch-codegen/src,packages/python/onnx9000-simplify/src,packages/python/onnx9000-skl2onnx/src,packages/python/onnx9000-sparse/src,packages/python/onnx9000-sphinx-demo/src,packages/python/onnx9000-tensorrt/src,packages/python/onnx9000-tflite-converter/src,packages/python/onnx9000-tflite-exporter/src,packages/python/onnx9000-toolkit/src,packag