name: Publish Triton Compiler to NPM

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - run: pnpm install
      - run: pnpm --filter @onnx9000/triton-compiler build
      - run: pnpm --filter @onnx9000/triton-compiler publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
