[project]
name = "onnx9000-mlir-lowering"
version = "1.0.0"
description = "ONNX Graph to MLIR dialect lowering passes (tosa, linalg) for ONNX9000"
dependencies = ["onnx9000-core", "onnx9000-mlir"]

[tool.uv.sources]
onnx9000-core = { workspace = true }
onnx9000-mlir = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_mlir_lowering"]

[tool.pytest.ini_options]
testpaths = ["tests"]
