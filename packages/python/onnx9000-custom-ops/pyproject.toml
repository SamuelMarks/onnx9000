[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "onnx9000-custom-ops"
version = "1.0.0"
description = "Custom operations registration for ONNX9000"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_custom_ops"]

[tool.pytest.ini_options]
testpaths = ["tests"]
