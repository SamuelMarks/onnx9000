[project]
name = "onnx9000-olive-optimizer"
version = "1.0.0"
description = "Olive hardware-aware quantization, pruning, and graph optimization pipeline for ONNX9000"
dependencies = ["onnx9000-core", "onnx9000-optimizer"]

[tool.uv.sources]
onnx9000-core = { workspace = true }
onnx9000-optimizer = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_olive_optimizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
