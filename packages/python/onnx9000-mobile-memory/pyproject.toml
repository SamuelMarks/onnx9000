[project]
name = "onnx9000-mobile-memory"
version = "1.0.0"
description = "Mobile memory arena optimization and activation checkpointing planner for ONNX9000"
dependencies = ["onnx9000-core"]

[tool.uv.sources]
onnx9000-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_mobile_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
