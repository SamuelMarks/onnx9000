[project]
name = "onnx9000-hummingbird"
version = "1.0.0"
description = "Tree-to-tensor neural transpilation engine for ONNX9000"
dependencies = ["onnx9000-core", "onnx9000-optimizer"]

[tool.uv.sources]
onnx9000-core = { workspace = true }
onnx9000-optimizer = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_hummingbird"]

[tool.pytest.ini_options]
testpaths = ["tests"]
