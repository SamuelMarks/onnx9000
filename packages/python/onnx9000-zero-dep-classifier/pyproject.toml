[project]
name = "onnx9000-zero-dep-classifier"
version = "1.0.0"
description = "Pure-Python zero-dependency image preprocessing and top-k classifier pipeline for ONNX9000"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_zero_dep_classifier"]

[tool.pytest.ini_options]
testpaths = ["tests"]
