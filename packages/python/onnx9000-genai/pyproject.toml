[project]
name = "onnx9000-genai"
version = "1.0.0"
description = "Generative AI runtime, tokenizers, KV-cache state, and decoding search for ONNX9000"
dependencies = ["onnx9000-core"]

[tool.uv.sources]
onnx9000-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_genai"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
testpaths = ["tests"]
pythonpath = ["src", "../onnx9000-core/src"]
