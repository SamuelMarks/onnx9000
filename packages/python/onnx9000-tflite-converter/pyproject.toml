[project]
name = "onnx9000-tflite-converter"
version = "1.0.0"
description = "ONNX to TFLite FlatBuffer converter and quantization bridge for ONNX9000"
dependencies = ["onnx9000-core", "onnx9000-tflite-exporter"]

[tool.uv.sources]
onnx9000-core = { workspace = true }
onnx9000-tflite-exporter = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_tflite_converter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
