[project]
name = "onnx9000-mlir"
version = "1.0.0"
description = "Typed MLIR AST and dialect definitions (tosa, linalg, tensor, func) for ONNX9000"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_mlir"]

[tool.pytest.ini_options]
testpaths = ["tests"]
