[project]
name = "onnx9000-new-model-arch"
version = "1.0.0"
description = "Modern model architecture builders (LLaMA, Mixtral, Mamba, RWKV, DiT, Whisper, ViT, Swin, CLIP) for ONNX9000"
dependencies = ["onnx9000-core"]

[tool.uv.sources]
onnx9000-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_new_model_arch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
