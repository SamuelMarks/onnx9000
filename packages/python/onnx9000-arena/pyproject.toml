[project]
name = "onnx9000-arena"
version = "1.0.0"
description = "Static Memory Arena Planner"
authors = [
    { name = "Samuel Marks", email = "samuel@example.com" }
]
dependencies = ["onnx9000-core"]

[tool.uv.sources]
onnx9000-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
