[project]
name = "onnx9000-compile"
version = "1.0.0"
dependencies = ["onnx9000-core"]

[tool.uv.sources]
onnx9000-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_compile"]

[tool.pytest.ini_options]
testpaths = ["tests"]
