[project]
name = "onnx9000-ort-training"
version = "1.0.0"
description = "Ahead-of-Time (AOT) autograd, VJP differentiation, and training graph builder for ONNX9000"
dependencies = ["onnx9000-core", "onnx9000-toolkit"]

[tool.uv.sources]
onnx9000-core = { workspace = true }
onnx9000-toolkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_ort_training"]

[tool.pytest.ini_options]
testpaths = ["tests"]
