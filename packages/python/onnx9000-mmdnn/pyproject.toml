[project]
name = "onnx9000-mmdnn"
version = "1.0.0"
description = "Cross-framework MMDNN model converter (Caffe, CNTK, Darknet, MXNet, NCNN) for ONNX9000"
dependencies = ["onnx9000-core", "onnx9000-converters"]

[tool.uv.sources]
onnx9000-core = { workspace = true }
onnx9000-converters = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_mmdnn"]

[tool.pytest.ini_options]
testpaths = ["tests"]
