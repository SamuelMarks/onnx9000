[project]
name = "onnx9000-paddle2onnx"
version = "1.0.0"
description = "PaddlePaddle to ONNX converter for ONNX9000"
authors = [
    { name = "Samuel Marks", email = "samuel@example.com" }
]
dependencies = ["onnx9000-core", "onnx9000-converters"]

[tool.uv.sources]
onnx9000-core = { workspace = true }
onnx9000-converters = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_paddle2onnx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
