[project]
name = "onnx9000-whisper-llm"
version = "1.0.0"
description = "Whisper speech-to-text encoder/decoder and LLM audio pipeline for ONNX9000"
authors = [
    { name = "Samuel Marks", email = "samuel@example.com" }
]
dependencies = ["onnx9000-core", "onnx9000-genai"]

[tool.uv.sources]
onnx9000-core = { workspace = true }
onnx9000-genai = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_whisper_llm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
