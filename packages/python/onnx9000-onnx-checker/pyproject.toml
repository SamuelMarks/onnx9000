[project]
name = "onnx9000-onnx-checker"
version = "1.0.0"
description = "ONNX model and tensor schema validator for ONNX9000"
dependencies = ["onnx9000-core"]

[tool.uv.sources]
onnx9000-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_onnx_checker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
