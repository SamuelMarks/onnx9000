[project]
name = "onnx9000-onnx2c"
version = "1.0.0"
description = "ONNX to dependency-free C89/C99 source code generator for ONNX9000"
dependencies = ["onnx9000-core", "onnx9000-c-compiler"]

[tool.uv.sources]
onnx9000-core = { workspace = true }
onnx9000-c-compiler = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_onnx2c"]

[tool.pytest.ini_options]
testpaths = ["tests"]
