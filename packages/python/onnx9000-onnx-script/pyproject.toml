[project]
name = "onnx9000-onnx-script"
version = "1.0.0"
description = "Python DSL for authoring and compiling ONNX9000 graphs"
dependencies = ["onnx9000-core", "onnx9000-toolkit"]

[tool.uv.sources]
onnx9000-core = { workspace = true }
onnx9000-toolkit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onnx9000", "src/onnx9000_onnx_script"]

[tool.pytest.ini_options]
testpaths = ["tests"]
